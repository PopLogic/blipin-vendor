name: ios-testflight

on:
  push:
    branches:
      - develop
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_ENV: staging


jobs:
  build:
    name: Build and Upload TestFlight
    runs-on:
      group: Blipin-Vendor
      labels: [self-hosted, macOS]
    environment: staging

    steps:
      - uses: actions/checkout@v4


      - uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION }}

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Pod install
        working-directory: ios
        run: |
          rm -rf Pods Podfile.lock
          pod install

#      - name: Setup App Store Connect API Key
#        run: |
#          mkdir -p ~/.appstoreconnect/private_keys
#          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Fastlane TestFlight
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        run: |
          cd ios
          bundle exec fastlane staging_validation